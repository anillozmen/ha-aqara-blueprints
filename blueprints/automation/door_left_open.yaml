blueprint:
  name: Kapı açık kaldı bildirimi
  description: >-
    Kapı veya pencere sensörü belirlenen süreden uzun açık kalırsa
    Home Assistant mobil uygulamasına bildirim gönderir.
  domain: automation
  source_url: https://github.com/anillozmen/ha-aqara-blueprints/blob/main/blueprints/automation/door_left_open.yaml
  input:
    contact_sensor:
      name: Kapı/pencere sensörü
      selector:
        entity:
          filter:
            - domain: binary_sensor
              device_class:
                - door
                - window
                - garage_door
                - opening
    open_duration:
      name: Açık kalma süresi
      description: Bu süreden uzun açık kalırsa bildirim gönderilir.
      default: 5
      selector:
        number:
          min: 1
          max: 120
          unit_of_measurement: dakika
    notify_device:
      name: Bildirim gidecek cihaz
      description: Home Assistant uygulaması kurulu telefon.
      selector:
        device:
          filter:
            - integration: mobile_app

mode: single

triggers:
  - trigger: state
    entity_id: !input contact_sensor
    to: "on"
    for:
      minutes: !input open_duration

variables:
  sensor: !input contact_sensor
  minutes: !input open_duration

actions:
  - domain: mobile_app
    type: notify
    device_id: !input notify_device
    title: "Açık kaldı"
    message: "{{ state_attr(sensor, 'friendly_name') or sensor }} {{ minutes }} dakikadır açık."
